<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela · Studio di pagine</title>
<link rel="icon" id="faviconLink" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.cp-sel{width:250px;padding:7px 10px;font-size:12.5px}
.cp-sq{position:relative;height:210px;border-radius:10px;border:1px solid var(--line);cursor:crosshair;background:#f00;touch-action:none}
.cp-hu{position:relative;height:18px;margin-top:12px;border-radius:99px;border:1px solid var(--line);cursor:ew-resize;touch-action:none}
.cp-knob{position:absolute;width:14px;height:14px;border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.cp-knob.bar{width:10px;height:24px;border-radius:7px}
.cp-native{display:flex;align-items:center;gap:10px;margin-top:12px}
.cp-native input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px;cursor:pointer}
.cp-native span{font-size:11px;font-weight:700;color:var(--ink-2)}
:root{--accent:#EF5A1A;--ink:#141414;--ink-2:#5c5850;--paper:#F2F0EC;--panel:rgba(255,255,255,.72);--solid:#fff;--line:rgba(20,20,20,.09);--shadow:0 10px 34px rgba(25,18,10,.12);--ease:cubic-bezier(.22,.9,.3,1.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(20,20,20,.16);border-radius:8px;border:2px solid transparent;background-clip:content-box}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;z-index:40;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line)}
.brand img{height:114px;width:auto;object-fit:contain}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;transition:transform .16s var(--ease),box-shadow .16s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,15,10,.12)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(239,90,26,.35)}
.btn.danger{background:#c81e1e;color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#3d3a35;transition:.15s}
.icon-btn:hover{background:rgba(20,20,20,.07);transform:translateY(-1px)}
.icon-btn:disabled{opacity:.28;pointer-events:none}
.seg{display:flex;background:rgba(20,20,20,.06);border-radius:11px;padding:3px;gap:2px}
.seg button{width:38px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,15,10,.14)}
#zoomLabel{min-width:52px;text-align:center;font-weight:800;font-size:12.5px}
#histCount{font-size:10.5px;font-weight:800;color:var(--ink-2);min-width:34px;text-align:center}
#workspace{flex:1;display:flex;min-height:0}
#toolrail{width:62px;padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);border-right:1px solid var(--line);overflow-y:auto}
.tool{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;color:#3d3a35;transition:.15s;flex:none}
.tool:hover{background:rgba(20,20,20,.07);transform:translateY(-2px)}
.tool.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(20,15,10,.28)}
.tool.on::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:4px;background:var(--accent)}
.tool-sep{width:28px;height:1px;background:var(--line);margin:5px 0;flex:none}
.tool[data-tip]:hover::before{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:60;pointer-events:none}
#strokeBox{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:2px}
#strokeBox .sb-l{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
#railStroke{writing-mode:vertical-lr;direction:rtl;width:22px;height:104px;accent-color:var(--accent);cursor:ns-resize}
#railStrokeVal{font-size:11px;font-weight:800;color:var(--accent)}
#mainCol{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#canvasView{flex:1;overflow:auto;position:relative;background:radial-gradient(rgba(20,20,20,.08) 1px,transparent 1.2px) 0 0/22px 22px,var(--paper)}
#canvasView.dropping{outline:3px dashed var(--accent);outline-offset:-10px}
#pages{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start;padding:56px 40px 60px;min-height:100%}
.page{position:relative;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 50px rgba(25,18,10,.16);flex:none}
.page.active{box-shadow:0 0 0 2px var(--accent),0 22px 60px rgba(25,18,10,.22)}
.page-chip{position:absolute;top:-30px;left:0;display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.page-chip .pc-name{background:var(--solid);border:1px solid var(--line);padding:3px 9px;border-radius:99px;cursor:text}
.page-chip .pc-name input{width:110px;font-size:11px;font-weight:800;border:1px solid var(--accent);border-radius:99px;padding:2px 8px}
.page-chip .pc-mode{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(20,20,20,.06);padding:3px 7px;border-radius:99px}
.empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:#b9b4ab;pointer-events:none;text-align:center;font-size:14px;font-weight:600;opacity:0;transition:opacity .4s}
.empty-hint.show{opacity:1}
.empty-hint b{font-family:'Space Grotesk';font-size:17px;color:#9a958c}
#propsBar{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);z-index:35;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;opacity:0;pointer-events:none;background:var(--panel);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);transition:.22s var(--ease);max-width:calc(100% - 160px);flex-wrap:wrap;justify-content:center}
#propsBar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pg-group{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--line)}
.pg-group:last-child{border-right:none}
.pg-group.hidden{display:none}
.pg-group label{font-size:11px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pbtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.pbtn:hover{background:rgba(20,20,20,.08)}
.pbtn.on{background:var(--ink);color:#fff}
#pbFont{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;background:#fff;max-width:160px}
#pbSize,#pbRadius{width:56px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;font-weight:700;background:#fff}
#pbBlend{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;background:#fff}
input[type=range]{accent-color:var(--accent)}
#docColors{position:absolute;bottom:124px;left:50%;transform:translateX(-50%);z-index:36;display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);max-width:72%;overflow-x:auto}
#docColors.show{display:flex}
#docColors .dc-t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
#docColors .sw{width:24px;height:24px;border-radius:7px;flex:none}
#pageStrip{display:flex;gap:10px;align-items:center;padding:10px 14px;overflow-x:auto;z-index:30;flex:none;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line);min-height:112px}
.pcard{flex:none;width:104px;border-radius:12px;padding:7px;background:#fff;border:1px solid var(--line);position:relative;user-select:none;transition:.18s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,15,10,.14)}
.pcard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard.dragover{border-color:var(--accent);border-style:dashed}
.pcard img{width:100%;height:62px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fafafa 0 50%) 0 0/12px 12px;border-radius:6px;border:1px solid var(--line)}
.pc-name{font-size:10.5px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.pc-name input{width:100%;font-size:10.5px;font-weight:800;border:1px solid var(--accent);border-radius:5px;padding:1px 4px}
.pc-acts{position:absolute;top:3px;right:3px;display:flex;gap:2px;opacity:0;transition:.15s}
.pcard:hover .pc-acts{opacity:1}
.pc-acts button{width:20px;height:20px;border-radius:6px;background:rgba(20,20,20,.75);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.pc-acts button:hover{background:var(--accent)}
.pcard-add{flex:none;width:88px;height:96px;border-radius:12px;border:2px dashed rgba(20,20,20,.22);color:var(--ink-2);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.pcard-add:hover{border-color:var(--accent);color:var(--accent)}
#palette{width:216px;padding:16px 14px;overflow-y:auto;z-index:30;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.pal-title{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.pal-title::after{content:'';flex:1;height:1px;background:var(--line)}
#curColorRow{display:flex;align-items:center;gap:10px}
#curSwatch{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px #fff;cursor:pointer;transition:.15s var(--ease)}
#curSwatch:hover{transform:scale(1.06)}
#hexInput{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;font-family:'Roboto Mono',monospace;background:#fff;text-transform:uppercase}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw{aspect-ratio:1;border-radius:8px;border:1px solid rgba(20,20,20,.12);cursor:pointer;transition:.15s var(--ease);position:relative}
.sw:hover{transform:scale(1.18);box-shadow:0 4px 12px rgba(20,15,10,.2);z-index:2}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.pal-field{display:flex;flex-direction:column;gap:6px}
.pal-field label{font-size:11px;font-weight:800;color:var(--ink-2);display:flex;justify-content:space-between}
.pal-field output{color:var(--accent);font-weight:800}
.pal-field input[type=range]{width:100%}
.pal-note{font-size:10.5px;color:#a09a90;line-height:1.5;font-weight:600}
#ctx{position:fixed;z-index:120;min-width:224px;padding:6px;border-radius:14px;display:none;background:rgba(255,255,255,.88);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line);box-shadow:0 18px 50px rgba(20,15,10,.28)}
.ctx-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600}
.ctx-i:hover{background:rgba(20,20,20,.07)}
.ctx-i.danger{color:#c81e1e}
.ctx-i .kbd{margin-left:auto;font-size:10px;font-weight:800;color:var(--ink-2);background:rgba(20,20,20,.07);padding:2px 6px;border-radius:5px}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-row{display:flex;gap:6px;padding:7px 10px;flex-wrap:wrap}
.ctx-row .sw{width:22px;height:22px;border-radius:6px}
.ctx-head{padding:5px 10px 7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pop{position:fixed;z-index:60;display:none;padding:8px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:var(--shadow)}
#shapesPop{flex-direction:column;gap:4px}
#shapesPop button,#flagPop button,#hlPop button{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center}
#flagPop,#hlPop{flex-direction:row;gap:4px}
#shapesPop button:hover,#flagPop button:hover,#hlPop button:hover{background:rgba(20,20,20,.08)}
#shapesPop button.on,#flagPop button.on,#hlPop button.on{background:var(--ink);color:#fff}
#strokePop{align-items:center;gap:10px;flex-direction:row;padding:10px 14px}
#strokePop .sp-t{font-size:11px;font-weight:800;color:var(--ink-2);text-transform:uppercase}
#strokePop input{width:150px}
#strokePop output{font-weight:800;color:var(--accent);font-size:12px;min-width:26px}
#colorGroupPop{padding:10px;min-width:160px}
#colorGroupPop .cg-t{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:8px}
#colorGroupPop .sw{width:26px;height:26px;display:inline-block;margin:3px}
#modalBack{position:fixed;inset:0;z-index:100;background:rgba(20,16,12,.34);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#modalBack.show{display:flex}
#modalBox{background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(20,15,10,.4);width:min(660px,94vw);max-height:90vh;overflow-y:auto;padding:26px;animation:modalIn .26s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.m-title{font-family:'Space Grotesk';font-weight:700;font-size:21px;display:flex;align-items:center;gap:10px}
.m-title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.m-sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:4px}
.m-body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.m-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.m-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.m-input,.m-select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;background:#fafaf8}
.m-input:focus,.m-select:focus{outline:none;border-color:var(--accent);background:#fff}
.big-seg{display:flex;gap:8px;flex-wrap:wrap}
.big-seg label{flex:1;min-width:110px}
.big-seg input{display:none}
.big-seg span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border:1.5px solid var(--line);border-radius:13px;font-weight:800;font-size:13px;text-align:center;background:#fafaf8;transition:.16s var(--ease)}
.big-seg small{font-size:10px;font-weight:600;color:var(--ink-2)}
.big-seg input:checked+span{border-color:var(--accent);background:#fff;transform:translateY(-2px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;background:#fafaf8}
.chip input{accent-color:var(--accent)}
.chip:has(input:checked){border-color:var(--accent);background:#FFF1EA}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.m-note{font-size:11px;color:#a09a90;font-weight:600;line-height:1.5;background:#faf7f2;border:1px dashed rgba(20,20,20,.15);border-radius:10px;padding:9px 12px}
kbd{background:rgba(20,20,20,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font-size:13px;font-weight:600}
.help-grid div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cp-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cp-radio{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer}
.cp-radio input{accent-color:var(--accent)}
.cp-wrap{display:flex;gap:22px;flex-wrap:wrap}
.cp-left{flex:1;min-width:240px}
.cp-right{flex:1;min-width:250px}
#cpSV{width:100%;height:200px;border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:none}
#cpHue{width:100%;height:16px;border-radius:99px;border:1px solid var(--line);margin-top:10px;cursor:ew-resize;touch-action:none}
.cp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px}
.cp-f{display:flex;flex-direction:column;gap:3px}
.cp-f b{font-size:10px;font-weight:800;color:var(--ink-2)}
.cp-f input{border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:12px;font-weight:700;background:#fafaf8;width:100%}
.cp-foot{display:flex;align-items:center;gap:12px;margin-top:16px}
#cpPrev{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px #fff}
#toasts{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
.toast.err{background:#c81e1e}
.toast .t-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.toast.out{opacity:0;transform:translateY(10px);transition:.35s}
@media (max-width:1100px){#palette{width:180px}.swatches{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header id="topbar">

function rebuildPagesDOM() { var host = $('#pages'); App.pages.forEach(function (p) { host.appendChild(p.wrap); }); renderStrip(); applyView(); }

/* ============ storia (50 passi) ============ */

/* ============ cursori ============ */

/* ============ strumenti ============ */

function onDown(p, e) {

      setTimeout(function () {
        var list = prev.indexOf(t) >= 0 ? prev.filter(function (o) { return o !== t; }) : prev.concat([t]);

      }, 0);
    }
    setTimeout(function () {
      var a = c.getActiveObject();
      p._moveOrigin = a ? { o: a, left: a.left, top: a.top } : null;
      if (e.e.altKey && a) p._altSnap = activeObjs(p).map(function (o) { return o.toObject(EXTRA); });

  }

    var data = JSON.parse(JSON.stringify(p._altSnap));
    fabric.util.enlivenObjects(data, function (clones) { clones.forEach(function (cl) { p.canvas.add(cl); }); p.canvas.requestRenderAll(); scheduleCommit(p); });
  }
}

  if (t._lockRatio && !(e.e && e.e.shiftKey)) { var s = Math.max(t.scaleX, t.scaleY); t.scaleX = s; t.scaleY = s; }
}

/* testo InDesign-like */

  p.canvas.requestRenderAll(); scheduleCommit(p);

/* forme + flag */
function starPoints() { var pts = []; for (var i = 0; i < 10; i++) { var a = Math.PI / 5 * i - Math.PI / 2, rad = i % 2 ? 21 : 50; pts.push({ x: 50 + rad * Math.cos(a), y: 50 + rad * Math.sin(a) }); } return pts; }
var ARROW_PTS = [{ x: 0, y: 18 }, { x: 62, y: 18 }, { x: 62, y: 0 }, { x: 100, y: 25 }, { x: 62, y: 50 }, { x: 62, y: 32 }, { x: 0, y: 32 }];
function startShape(p, pt) {
  var isFlag = App.tool === 'flag';
  var t = isFlag ? App.flag : App.shape, o;
  if (t === 'flagCheck' || t === 'flagCross') o = new fabric.Path(FLAG_D[t], { fill: '', stroke: '#141414', strokeWidth: App.strokeWidth, strokeLineCap: 'round', strokeLineJoin: 'round', opacity: App.opacity, left: pt.x, top: pt.y, scaleX: .01, scaleY: .01 });
  else if (t === 'rect' || t === 'rrect') o = new fabric.Rect({ fill: App.color, opacity: App.opacity, rx: t === 'rrect' ? 14 : 0, ry: t === 'rrect' ? 14 : 0, left: pt.x, top: pt.y, width: 1, height: 1 });
  else if (t === 'ellipse') o = new fabric.Ellipse({ fill: App.color, opacity: App.opacity, left: pt.x, top: pt.y, rx: .5, ry: .5 });

    else if (['star', 'flagCheck', 'flagCross'].indexOf(d.type) >= 0) o.set({ scaleX: 1.1, scaleY: 1.1 });
    else if (d.type === 'arrow') o.set({ scaleX: 1.4, scaleY: 1.4 });
    else if (d.type === 'tri') o.set({ width: 120, height: 120 });
    else if (d.type === 'ellipse') o.set({ rx: 60, ry: 60 });
    else o.set({ width: 140, height: 110 });

/* secchiello / contagocce / gomma parziale */

    target.set((target.type === 'path' || target.type === 'line') ? 'stroke' : 'fill', App.color);
    c.requestRenderAll(); scheduleCommit(p);

  c.discardActiveObject(); c.requestRenderAll();
}
function pickColor(p, e) {

function renderPDFPages(file) {
  return file.arrayBuffer().then(function (buf) { return pdfjsLib.getDocument({ data: buf }).promise; }).then(function (pdf) {
    var chain = Promise.resolve([]);
    for (var i = 1; i <= pdf.numPages; i++) {
      chain = chain.then(function (out) {
        var n = out.length + 1;
        return pdf.getPage(n).then(function (pg) {
          var vp = pg.getViewport({ scale: 2 });
          var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          return pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
            out.push({ i: n, w: Math.round(vp.width), h: Math.round(vp.height), url: cv.toDataURL('image/png') });
            return out;
          });
        });
      });
    }
    return chain.then(function (out) { return { base: file.name.replace(/\.pdf$/i, ''), pages: out }; });
  });
}
function importPDF(file, mode) {
  toast('Lettura PDF…');
  renderPDFPages(file).then(function (r) {
    if (mode === 'current') {
      var p = curPage();
      r.pages.forEach(function (pg, k) {
        fabric.Image.fromURL(pg.url, function (im) { var sc = Math.min(1, (p.w * .8) / im.width); im.set({ left: 40 + k * 30, top: 40 + k * 30, scaleX: sc, scaleY: sc }); p.canvas.add(im); p.canvas.requestRenderAll(); scheduleCommit(p); });
      });

    r.pages.forEach(function (pg) { createPage({ name: r.base + ' · pag ' + pg.i, w: pg.w, h: pg.h, mode: 'raster', bg: pg.url }); });
    setActivePage(App.pages.length - r.pages.length); fitZoom();
    toast(r.pages.length + ' pagine importate');

}

function importProjectFile(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var data;
    try { data = JSON.parse(fr.result); } catch (e) { toast('File non valido'); return; }
    if (!data || data.app !== 'tela' || !data.pages) { toast('File non valido: usa un .tela di Tela'); return; }
    if (data.kind === 'overlay') {
      var chain = Promise.resolve();
      data.pages.forEach(function (op, i) {
        chain = chain.then(function () {
          var p = App.pages[i];
          if (!p) p = createPage({ name: 'Pagina ' + (i + 1), w: op.w, h: op.h });
          var tgt = p.canvas;
          return new Promise(function (res) { fabric.util.enlivenObjects(op.objects, function (objs) { objs.forEach(function (o) { tgt.add(o); }); tgt.requestRenderAll(); scheduleCommit(p); res(); }); });
        });
      });
      chain.then(function () { refreshDocColors(); toast('Livello applicato alle pagine'); });
      return;
    }
    var doIt = function () {
      App.pages.forEach(function (p) { p.canvas.dispose(); p.wrap.remove(); });
      App.pages = [];
      data.pages.forEach(function (pd) {
        var p = createPage({ name: pd.name, w: pd.w, h: pd.h, mode: pd.mode });
        p.loading = true;
        p.canvas.loadFromJSON(JSON.stringify(pd.json), function () { p.loading = false; p.last = JSON.stringify(snap(p.canvas)); p.canvas.renderAll(); updateThumb(p); updateEmptyHint(p); });
      });
      setActivePage(0); fitZoom(); refreshDocColors(); toast('Progetto importato ✓');
    };
    if (App.pages.some(function (p) { return p.canvas.getObjects().length; })) {
      askConfirm({ title: 'Sostituire il lavoro attuale?', msg: 'Importando questo progetto le pagine attuali verranno sostituite.', ok: 'Importa' }).then(function (ok) { if (ok) doIt(); });

}

  var mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { dismissModal(); $('#ctx').style.display = 'none'; ['shapesPop', 'flagPop', 'hlPop', 'strokePop', 'colorGroupPop'].forEach(function (id) { $('#' + id).style.display = 'none'; }); return; }

  var editing = p.canvas.getActiveObject() && p.canvas.getActiveObject().isEditing;
  var k = e.key.toLowerCase();
  if (mod && !e.shiftKey && k === 'c' && !editing) { e.preventDefault(); copySel(false); return; }
  if (mod && !e.shiftKey && k === 'x' && !editing) { e.preventDefault(); copySel(true); return; }
  if (mod && !e.shiftKey && k === 'v' && !editing) { e.preventDefault(); pasteSel(false); return; }
  if (mod && k === 'a' && !editing) { e.preventDefault(); selectAllPage(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 's') { e.preventDefault(); saveProject(); return; }
  if (mod && !e.shiftKey && k === 'z') { e.preventDefault(); undo(); return; }
  if (mod && e.shiftKey && k === 'z') { e.preventDefault(); redo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (editing) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  var step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-step, 0); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nudge(step, 0); }
  if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -step); }

  /* drag&drop file sulla tela */
  var cv = $('#canvasView');
  cv.addEventListener('dragover', function (e) { if (Array.prototype.slice.call(e.dataTransfer.types).indexOf('Files') >= 0) { e.preventDefault(); cv.classList.add('dropping'); } });
  cv.addEventListener('dragleave', function () { cv.classList.remove('dropping'); });
  cv.addEventListener('drop', function (e) {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault(); cv.classList.remove('dropping');
    var files = Array.prototype.slice.call(e.dataTransfer.files);
    askDropMode(files[0].name).then(function (mode) {
      if (!mode) return;
      files.forEach(function (f) {
        var isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
        if (isPdf) importPDF(f, mode);
        else if (mode === 'new') importImagePage(f);
        else addImageToObject(curPage(), f);
      });
    });
  });
  cv.addEventListener('wheel', function (e) { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(App.zoom * (e.deltaY < 0 ? 1.1 : .9)); } }, { passive: false });
  $('#modalBack').addEventListener('mousedown', function (e) { if (e.target === $('#modalBack')) dismissModal(); });
  document.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) dismissModal(); });
  $('#btnExport').onclick = openExport;
  $('#btnHelp').onclick = function () {
    openModal('<div class="m-title"><span class="dot"></span>Guida e scorciatoie</div><div class="m-body"><div class="help-grid"><div>Copia / Taglia / Incolla <span><kbd>Ctrl</kbd><kbd>C/X/V</kbd></span></div><div>Seleziona tutto / Duplica <span><kbd>Ctrl</kbd><kbd>A/D</kbd></span></div><div>Annulla / Ripeti <span><kbd>Ctrl Z</kbd> / <kbd>Ctrl ⇧ Z</kbd></span></div><div>Duplica trascinando <span><kbd>Alt</kbd>+drag</span></div><div>Blocca asse / ratio libero <span><kbd>⇧</kbd>+drag</span></div><div>Sposta preciso <span><kbd>←↑↓→</kbd> (⇧ ×10)</span></div><div>Strumenti <span><kbd>V T P H E S F B I</kbd></span></div><div>Cambia pagina <span><kbd>PgSu/PgGiù</kbd></span></div><div>Spessore strumento <span>tasto destro icona</span></div><div>Colore avanzato <span>click colore attivo</span></div></div><div class="m-note" style="margin-top:14px">Testo: la casella va a capo da sola; maniglie laterali = allarghi il box senza stirare il carattere; Invio = a capo manuale. Gomma: cancella solo la porzione dentro il cerchio (spezza i tratti). Forme: ratio corretto in inserimento, ⇧ per deformare. Barra in basso: colori del documento (tasto destro = seleziona per colore). Icona strati in alto: salva solo i tuoi elementi da riapplicare su altre foto. Vista a 2 pagine: coppia fissa, modifichi entrambe senza salti.</div></div><div class="m-actions"><button class="btn accent" data-close>Perfetto</button></div>');
  };
}

/* ============ avvio ============ */
initUI();
buildSwatches('#swModern', MODERN);
applyColor('#141414');
setStroke(4);
createPage({ name: 'Pagina 1', w: 794, h: 1123, mode: 'vector', activate: true });
fitZoom();
refreshHistoryUI();
refreshCursors();
refreshDocColors();
toast('Tela pronta · trascina un PDF sulla tela o inizia a creare');
</script>
