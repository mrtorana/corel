<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela · Studio di pagine</title>
<link rel="icon" id="faviconLink" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Archivo+Black&family=Pacifico&family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Ubuntu&family=Bodoni+Moda:ital,opsz,wght@0,9..96,400;0,9..96,700;1,9..96,400&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Nunito:wght@400;700&family=Raleway:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--accent:#EF5A1A;--ink:#141414;--ink-2:#5c5850;--paper:#F2F0EC;--panel:rgba(255,255,255,.72);--panel-solid:#fff;--line:rgba(20,20,20,.09);--shadow:0 10px 34px rgba(25,18,10,.12);--ease:cubic-bezier(.22,.9,.3,1.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(20,20,20,.16);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;z-index:40;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;margin-right:6px;user-select:none}
.brand img{height:114px;width:auto;object-fit:contain}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;transition:transform .16s var(--ease),box-shadow .16s,background .16s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,15,10,.12)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(239,90,26,.35)}
.btn.accent:hover{box-shadow:0 8px 22px rgba(239,90,26,.5)}
.btn.danger{background:#c81e1e;color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .15s var(--ease),color .15s;color:#3d3a35}
.icon-btn:hover{background:rgba(20,20,20,.07);transform:translateY(-1px)}
.icon-btn:disabled{opacity:.28;pointer-events:none}
.seg{display:flex;background:rgba(20,20,20,.06);border-radius:11px;padding:3px;gap:2px}
.seg button{width:38px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,15,10,.14)}
#zoomLabel{min-width:52px;text-align:center;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
#histCount{font-size:10.5px;font-weight:800;color:var(--ink-2);min-width:34px;text-align:center}
#workspace{flex:1;display:flex;min-height:0}
#toolrail{width:62px;padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-right:1px solid var(--line);overflow-y:auto}
.tool{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;color:#3d3a35;transition:background .15s,transform .18s var(--ease),color .15s;flex:none}
.tool:hover{background:rgba(20,20,20,.07);transform:translateY(-2px)}
.tool.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(20,15,10,.28)}
.tool.on::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:4px;background:var(--accent)}
.tool-sep{width:28px;height:1px;background:var(--line);margin:5px 0;flex:none}
.tool[data-tip]:hover::before{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;animation:tipIn .18s var(--ease)}
@keyframes tipIn{from{opacity:0;transform:translate(-6px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
#strokeBox{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:2px}
#strokeBox .sb-l{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
#railStroke{writing-mode:vertical-lr;direction:rtl;width:22px;height:104px;accent-color:var(--accent);cursor:ns-resize}
#railStrokeVal{font-size:11px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
#mainCol{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#canvasView{flex:1;overflow:auto;position:relative;background:radial-gradient(rgba(20,20,20,.08) 1px,transparent 1.2px) 0 0/22px 22px,var(--paper)}
#canvasView.dropping{outline:3px dashed var(--accent);outline-offset:-10px}
#canvasView.dropping::after{content:'Rilascia: sceglierai nuova pagina o pagina corrente';position:sticky;left:50%;top:14px;transform:translateX(-50%);width:max-content;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:8px 16px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pages{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start;padding:56px 40px 60px;min-height:100%}
.page{position:relative;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 50px rgba(25,18,10,.16);flex:none}
.page.active{box-shadow:0 0 0 2px var(--accent),0 1px 2px rgba(0,0,0,.08),0 22px 60px rgba(25,18,10,.22)}
.page-chip{position:absolute;top:-30px;left:0;display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.page-chip .pc-name{background:var(--panel-solid);border:1px solid var(--line);padding:3px 9px;border-radius:99px;box-shadow:0 2px 8px rgba(20,15,10,.08);cursor:text}
.page-chip .pc-name input{width:110px;font-size:11px;font-weight:800;border:1px solid var(--accent);border-radius:99px;padding:2px 8px}
.page-chip .pc-mode{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(20,20,20,.06);padding:3px 7px;border-radius:99px}
.empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:#b9b4ab;pointer-events:none;text-align:center;font-size:14px;font-weight:600;opacity:0;transition:opacity .4s}
.empty-hint.show{opacity:1}
.empty-hint b{font-family:'Space Grotesk';font-size:17px;color:#9a958c}
#propsBar{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);z-index:35;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;opacity:0;pointer-events:none;background:var(--panel);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);transition:.22s var(--ease);max-width:calc(100% - 160px);flex-wrap:wrap;justify-content:center}
#propsBar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pg-group{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--line)}
.pg-group:last-child{border-right:none}
.pg-group.hidden{display:none}
.pg-group label{font-size:11px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pbtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:.15s}
.pbtn:hover{background:rgba(20,20,20,.08)}
.pbtn.on{background:var(--ink);color:#fff}
#pbFont{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;background:#fff;max-width:160px}
#pbSize,#pbRadius{width:56px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;font-weight:700;background:#fff}
#pbBlend{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;background:#fff}
input[type=range]{accent-color:var(--accent)}
#docColors{position:absolute;bottom:122px;left:50%;transform:translateX(-50%);z-index:36;display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);max-width:72%;overflow-x:auto}
#docColors.show{display:flex}
#docColors .dc-t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
#docColors .sw{width:24px;height:24px;border-radius:7px;flex:none}
#pageStrip{display:flex;gap:10px;align-items:center;padding:10px 14px;overflow-x:auto;z-index:30;flex:none;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line);min-height:112px}
.pcard{flex:none;width:104px;border-radius:12px;padding:7px;background:#fff;border:1px solid var(--line);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;position:relative;user-select:none}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,15,10,.14)}
.pcard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(239,90,26,.18)}
.pcard.dragover{border-color:var(--accent);border-style:dashed}
.pcard img{width:100%;height:62px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fafafa 0 50%) 0 0/12px 12px;border-radius:6px;border:1px solid var(--line)}
.pc-name{font-size:10.5px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.pc-name input{width:100%;font-size:10.5px;font-weight:800;border:1px solid var(--accent);border-radius:5px;padding:1px 4px}
.pc-acts{position:absolute;top:3px;right:3px;display:flex;gap:2px;opacity:0;transition:.15s}
.pcard:hover .pc-acts{opacity:1}
.pc-acts button{width:20px;height:20px;border-radius:6px;background:rgba(20,20,20,.75);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.pc-acts button:hover{background:var(--accent)}
.pcard-add{flex:none;width:88px;height:96px;border-radius:12px;border:2px dashed rgba(20,20,20,.22);color:var(--ink-2);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-weight:800;font-size:11px;transition:.18s}
.pcard-add:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
#palette{width:216px;padding:16px 14px;overflow-y:auto;z-index:30;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.pal-title{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.pal-title::after{content:'';flex:1;height:1px;background:var(--line)}
#curColorRow{display:flex;align-items:center;gap:10px}
#curSwatch{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px #fff;transition:background .2s,transform .15s var(--ease);cursor:pointer}
#curSwatch:hover{transform:scale(1.06)}
#hexInput{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;font-family:'Roboto Mono',monospace;background:#fff;text-transform:uppercase}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw{aspect-ratio:1;border-radius:8px;border:1px solid rgba(20,20,20,.12);cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s;position:relative}
.sw:hover{transform:scale(1.18);box-shadow:0 4px 12px rgba(20,15,10,.2);z-index:2}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.pal-field{display:flex;flex-direction:column;gap:6px}
.pal-field label{font-size:11px;font-weight:800;color:var(--ink-2);display:flex;justify-content:space-between}
.pal-field output{color:var(--accent);font-weight:800}
.pal-field input[type=range]{width:100%}
.pal-note{font-size:10.5px;color:#a09a90;line-height:1.5;font-weight:600}
#ctx{position:fixed;z-index:120;min-width:224px;padding:6px;border-radius:14px;display:none;background:rgba(255,255,255,.88);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line);box-shadow:0 18px 50px rgba(20,15,10,.28);animation:ctxIn .14s var(--ease)}
@keyframes ctxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.ctx-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600;transition:background .1s}
.ctx-i:hover{background:rgba(20,20,20,.07)}
.ctx-i.danger{color:#c81e1e}
.ctx-i .kbd{margin-left:auto;font-size:10px;font-weight:800;color:var(--ink-2);background:rgba(20,20,20,.07);padding:2px 6px;border-radius:5px}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-row{display:flex;gap:6px;padding:7px 10px;flex-wrap:wrap}
.ctx-row .sw{width:22px;height:22px;border-radius:6px}
.ctx-head{display:flex;align-items:center;gap:8px;padding:5px 10px 7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pop{position:fixed;z-index:60;display:none;padding:8px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:var(--shadow);animation:ctxIn .16s var(--ease)}
#shapesPop{flex-direction:column;gap:4px}
#shapesPop button,#flagPop button,#hlPop button{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:.14s}
#flagPop,#hlPop{flex-direction:row;gap:4px}
#shapesPop button:hover,#flagPop button:hover,#hlPop button:hover{background:rgba(20,20,20,.08);transform:scale(1.06)}
#shapesPop button.on,#flagPop button.on,#hlPop button.on{background:var(--ink);color:#fff}
#strokePop{align-items:center;gap:10px;flex-direction:row;padding:10px 14px}
#strokePop .sp-t{font-size:11px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
#strokePop input{width:150px}
#strokePop output{font-weight:800;color:var(--accent);font-size:12px;min-width:26px}
#colorGroupPop{padding:10px;min-width:160px}
#colorGroupPop .cg-t{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:8px;letter-spacing:.05em}
#colorGroupPop .sw{width:26px;height:26px;display:inline-block;margin:3px}
#colorGroupPop .none{font-size:12px;color:#a09a90;font-weight:600}
#modalBack{position:fixed;inset:0;z-index:100;background:rgba(20,16,12,.34);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#modalBack.show{display:flex}
#modalBox{background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(20,15,10,.4);width:min(640px,94vw);max-height:90vh;overflow-y:auto;padding:26px;animation:modalIn .26s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.m-title{font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.m-title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.m-sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:4px}
.m-body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.m-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.m-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.m-input,.m-select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;background:#fafaf8;transition:border-color .15s}
.m-input:focus,.m-select:focus{outline:none;border-color:var(--accent);background:#fff}
.big-seg{display:flex;gap:8px;flex-wrap:wrap}
.big-seg label{flex:1;min-width:110px}
.big-seg input{display:none}
.big-seg span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border:1.5px solid var(--line);border-radius:13px;font-weight:800;font-size:13px;transition:.16s var(--ease);text-align:center;background:#fafaf8}
.big-seg small{font-size:10px;font-weight:600;color:var(--ink-2)}
.big-seg input:checked+span{border-color:var(--accent);background:#fff;box-shadow:0 4px 16px rgba(239,90,26,.18);transform:translateY(-2px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;background:#fafaf8}
.chip input{accent-color:var(--accent)}
.chip:has(input:checked){border-color:var(--accent);background:#FFF1EA}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.m-note{font-size:11px;color:#a09a90;font-weight:600;line-height:1.5;background:#faf7f2;border:1px dashed rgba(20,20,20,.15);border-radius:10px;padding:9px 12px}
kbd{background:rgba(20,20,20,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font-size:13px;font-weight:600}
.help-grid div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cp-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cp-radio{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer}
.cp-radio input{accent-color:var(--accent)}
.cp-wrap{display:flex;gap:22px;flex-wrap:wrap}
.cp-left{flex:1;min-width:240px}
.cp-right{flex:1;min-width:250px}
#cpSV{width:100%;height:200px;border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:none}
#cpHue{width:100%;height:16px;border-radius:99px;border:1px solid var(--line);margin-top:10px;cursor:ew-resize;touch-action:none}
.cp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px}
.cp-f{display:flex;flex-direction:column;gap:3px}
.cp-f b{font-size:10px;font-weight:800;color:var(--ink-2)}
.cp-f input{border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:12px;font-weight:700;background:#fafaf8;width:100%}
.cp-f input:focus{outline:none;border-color:var(--accent);background:#fff}
#cpHex{font-family:'Roboto Mono',monospace;text-transform:uppercase}
.cp-foot{display:flex;align-items:center;gap:12px;margin-top:16px}
#cpPrev{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px #fff}
#toasts{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;animation:toastIn .3s var(--ease)}
.toast .t-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.toast.out{opacity:0;transform:translateY(10px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@media (max-width:1100px){#palette{width:180px}.swatches{grid-template-columns:repeat(5,1fr)}}
</style>

<body>

<header id="topbar">

<div id="workspace">
  <nav id="toolrail">
    <button class="tool on" data-tool="select" data-tip="Selezione smart · V"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m4 3 7.6 18 2.5-7.4L21.5 11 4 3z"/></svg></button>
    <button class="tool" data-tool="text" data-tip="Casella di testo (va a capo, box ridimensionabile) · T"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16m-3 0h6"/></svg></button>
    <button class="tool" data-tool="pen" data-tip="Matita / Penna · P"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
    <button class="tool" data-tool="highlight" data-tip="Evidenziatore fluo · H" id="toolHighlight"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m9 11 6-6 4 4-6 6H9v-4z"/><path d="M5 21h14"/><path d="M9 15 5 19h4"/></svg></button>
    <button class="tool" data-tool="eraser" data-tip="Gomma parziale (spezza i tratti) · E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m7 21-4.6-4.6a2 2 0 0 1 0-2.8l10-10a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L11 21H7z"/><path d="M5.5 11.5 12 18M21 21H9"/></svg></button>
    <button class="tool" data-tool="shapes" data-tip="Forme base · S" id="toolShapes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="9" height="9" rx="1.5"/><circle cx="16.5" cy="16.5" r="4.5"/></svg></button>
    <button class="tool" data-tool="flag" data-tip="Segni di compilazione V / X per campi documento · F" id="toolFlag"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 6L20 5"/></svg></button>
    <button class="tool" data-tool="fill" data-tip="Riempimento intelligente · B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m19 11-8-8L3 11l8 8 8-8z"/><path d="M21.5 17.5s1.5 2 1.5 3.2a1.8 1.8 0 0 1-3.4.8h-.2a1.8 1.8 0 0 1 2.1-4z" fill="currentColor" stroke="none"/></svg></button>
    <button class="tool" data-tool="picker" data-tip="Contagocce · I"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-4 9.5-9.5 3 3L6 21l-4 1z"/><path d="m13 7 4-4 4 4-4 4"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tool" id="btnSignature" data-tip="Importa firma / immagine (PNG·JPG)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.6-4.6a1.5 1.5 0 0 0-2.2 0L5 20"/></svg></button>
    <button class="tool" id="btnColorGroup" data-tip="Seleziona per colore"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="4.5"/><circle cx="16.5" cy="10.5" r="4.5" opacity=".55"/><circle cx="11" cy="16.5" r="4.5" opacity=".3"/></svg></button>
    <div class="tool-sep"></div>
    <div id="strokeBox" title="Spessore dello strumento attivo"><span class="sb-l">Spess.</span><input type="range" id="railStroke" min="1" max="48" value="4"><span id="railStrokeVal">4</span></div>
  </nav>

  <main id="mainCol">
    <div id="propsBar">
      <div class="pg-group hidden" id="pgSel">
        <button class="pbtn" id="pbDup" title="Duplica · Ctrl+D"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 3H5a2 2 0 0 0-2 2v11"/></svg></button>
        <button class="pbtn" id="pbFwd" title="Porta avanti"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        <button class="pbtn" id="pbBwd" title="Porta indietro"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14m6-6-6 6-6-6"/></svg></button>

      </div>

        <input id="pbSize" type="number" min="6" max="400" value="32" title="Dimensione">
        <button class="pbtn" id="pbB" style="font-weight:900">B</button>

    <div><div class="pal-title">Moderni</div><div class="swatches" id="swModern" style="margin-top:10px"></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => 'p' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EXTRA = ['_guide', '_prevOp', '_lockRatio'];
const FAV = ['Arial','Roboto','Montserrat','Bodoni Moda','Ubuntu'];
const SYS = ['Helvetica','Verdana','Georgia','Times New Roman','Courier New','Trebuchet MS','Tahoma','Impact','Palatino Linotype','Garamond','Segoe UI','Comic Sans MS'];
const GOOG = ['Space Grotesk','Manrope','Playfair Display','Bebas Neue','Caveat','Lora','Archivo Black','Pacifico','Roboto Mono','Open Sans','Lato','Poppins','Nunito','Raleway','Oswald'];
const MODERN = ['#141414','#FFFFFF','#EF5A1A','#F97316','#FACC15','#22C55E','#0EA5E9','#2563EB','#7C3AED','#EC4899','#DC2626','#14B8A6','#8B5CF6','#64748B','#1E293B','#78350F'];
const PASTEL = ['#FFE5D4','#FFEDC9','#FFF6C9','#DCF2D4','#D3F0EA','#D6E9FF','#DEDCFF','#F4D9F5','#FFD9E4','#E8E2DA','#F3E3D3','#D9E4D1'];
const FLUO = { giallo: '#FFE600', verde: '#39FF14', rosa: '#FF10F0' };

const App = { pages: [], active: 0, zoom: 1, tool: 'select', prevTool: 'select', shape: 'rrect', flag: 'flagCheck', highlight: FLUO.giallo, color: '#141414', opacity: 1, strokeWidth: 4, view: 'single', HIST: 50, clipboard: null, font: { family: 'Arial', size: 32, bold: false, italic: false, underline: false } };

fabric.Object.prototype.set({ cornerColor:'#EF5A1A', cornerStrokeColor:'#ffffff', borderColor:'#141414', cornerSize:9, cornerStyle:'circle', transparentCorners:false, borderScaleFactor:1.5 });
const curPage = () => App.pages[App.active];
const isTyping = () => { const a = document.activeElement; return a && (['INPUT','TEXTAREA','SELECT'].includes(a.tagName) || a.isContentEditable); };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span class="t-dot"></span>' + esc(msg); $('#toasts').appendChild(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 380); }, ms); }

/* favicon negativa in dark mode */
(function () {
  const link = $('#faviconLink'), mq = matchMedia('(prefers-color-scheme: dark)');
  const L = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23EF5A1A'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='36' font-weight='800' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E";
  const D = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2310A5EB'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='36' font-weight='800' text-anchor='middle' fill='black'%3ET%3C/text%3E%3C/svg%3E";
  const apply = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = img.width || 64; c.height = img.height || 64; const x = c.getContext('2d'); if (mq.matches) x.filter = 'invert(1)'; x.drawImage(img, 0, 0); try { link.href = c.toDataURL('image/png'); } catch (e) {} }; img.onerror = () => { link.href = mq.matches ? D : L; }; img.src = 'favicon.png'; };
  apply(); mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
})();

/* ================= PAGINE ================= */
function createPage(o) {
  const p = { id: uid(), name: o.name || ('Pagina ' + (App.pages.length + 1)), w: o.w, h: o.h, mode: o.mode || 'vector', undo: [], redo: [], sel: [], loading: true };
  const wrap = document.createElement('div');
  wrap.className = 'page';
  wrap.innerHTML = `<div class="page-chip"><span class="pc-name" title="Doppio clic per rinominare">${esc(p.name)}</span><span class="pc-mode">${p.mode === 'vector' ? 'Vettoriale' : 'Raster'}</span></div><div class="canvas-holder"></div><div class="empty-hint"><b>Pagina vuota</b>Importa un file, aggiungi testo o disegna<br>con gli strumenti a sinistra</div>`;
  p.wrap = wrap; p.hintEl = wrap.querySelector('.empty-hint'); p.chipEl = wrap.querySelector('.pc-name');
  const el = document.createElement('canvas');
  wrap.querySelector('.canvas-holder').appendChild(el);
  p.canvas = new fabric.Canvas(el, { preserveObjectStacking: true, width: p.w, height: p.h, backgroundColor: '#ffffff', selectionColor: 'rgba(239,90,26,.10)', selectionBorderColor: '#EF5A1A', selectionLineWidth: 1.2 });
  bindCanvas(p);
  App.pages.push(p); $('#pages').appendChild(wrap);
  const done = () => { p.loading = false; pageInit(p); if (o.activate) setActivePage(App.pages.indexOf(p)); };
  if (o.bg) p.canvas.setBackgroundImage(o.bg, done); else done();
  if (o.after) o.after(p);
  wrap.addEventListener('mousedown', () => { const i = App.pages.indexOf(p); if (i !== App.active) setActivePage(i); });
  wrap.addEventListener('contextmenu', e => { e.preventDefault(); openCtx(e.clientX, e.clientY, targetAt(p, e), p); });
  p.chipEl.addEventListener('dblclick', e => { e.stopPropagation(); renameInline(p.chipEl, p); });
  renderStrip(); applyView(); setTool(App.tool);
  return p;
}
function pageInit(p) { p.canvas.setZoom(App.zoom); p.canvas.setDimensions({ width: p.w * App.zoom, height: p.h * App.zoom }); p.wrap.style.width = p.w * App.zoom + 'px'; p.last = JSON.stringify(snap(p.canvas)); updateThumb(p); updateEmptyHint(p); refreshDocColors(); }
function snap(canvas) { const j = canvas.toJSON(EXTRA); j.objects = j.objects.filter(o => !o._temp); return j; }
function setActivePage(i) { App.active = clamp(i, 0, App.pages.length - 1); App.pages.forEach((p, k) => p.wrap.classList.toggle('active', k === App.active)); $$('.pcard').forEach((c, k) => c.classList.toggle('active', k === App.active)); applyView(); updatePropsBar(); refreshHistoryUI(); const card = $$('.pcard')[App.active]; if (card) card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }
function applyView() {
  const anchor = App.active - (App.active % 2);
  App.pages.forEach((p, i) => {
    let show = true;
    if (App.view === 'single') show = i === App.active;
    if (App.view === 'duo') show = i === anchor || i === anchor + 1;
    p.wrap.style.display = show ? '' : 'none';
  });
}
function updateEmptyHint(p) { p.hintEl.classList.toggle('show', p.canvas.getObjects().length === 0 && !p.canvas.backgroundImage); }
function updateThumb(p) { if (!p.thumbImg) return; try { p.thumbImg.src = p.canvas.toDataURL({ multiplier: 96 / Math.max(p.w, p.h) }); } catch (e) {} }
function renameInline(el, p) { const old = p.name; el.innerHTML = `<input value="${esc(old)}">`; const inp = el.querySelector('input'); inp.focus(); inp.select(); const done = () => { p.name = inp.value.trim() || old; el.textContent = p.name; renderStrip(); }; inp.addEventListener('blur', done); inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') inp.blur(); }); }
function renderStrip() {
  const strip = $('#pageStrip'); strip.innerHTML = '';
  App.pages.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'pcard' + (i === App.active ? ' active' : '');
    card.draggable = true;
    card.innerHTML = `<img alt=""><div class="pc-name">${esc(p.name)}</div><div class="pc-acts"><button data-act="up" title="Sposta prima">‹</button><button data-act="down" title="Sposta dopo">›</button><button data-act="dup" title="Duplica pagina">⧉</button><button data-act="del" title="Elimina pagina">✕</button></div>`;
    p.thumbImg = card.querySelector('img'); updateThumb(p);
    card.addEventListener('click', () => setActivePage(i));
    card.addEventListener('dblclick', e => { if (!e.target.closest('.pc-acts')) renameInline(card.querySelector('.pc-name'), p); });
    card.addEventListener('contextmenu', e => { e.preventDefault(); openPageCtx(e.clientX, e.clientY, i); });
    card.querySelector('.pc-acts').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); const idx = App.pages.indexOf(p); if (b.dataset.act === 'up') movePage(idx, -1); if (b.dataset.act === 'down') movePage(idx, 1); if (b.dataset.act === 'dup') duplicatePage(idx); if (b.dataset.act === 'del') deletePage(idx); });
    card.addEventListener('dragstart', () => { strip._dragIdx = i; });

async function importPDF(file, mode) {

  pages.forEach(pg => createPage({ name: base + ' · pag ' + pg.i, w: pg.w, h: pg.h, mode: 'raster', bg: pg.url }));

}

function buildSwatches(id, list) { const el = $(id); el.innerHTML = list.map(c => `<span class="sw" style="background:${c}" data-c="${c}" title="${c}"></span>`).join(''); el.addEventListener('click', e => { const s = e.target.closest('[data-c]'); if (s) applyColor(s.dataset.c); }); }
buildSwatches('#swModern', MODERN); buildSwatches('#swPastel', PASTEL);
function applyColor(c) {
  App.color = c;
  $('#curSwatch').style.background = c; $('#hexInput').value = c.toUpperCase();
  $$('#palette .sw').forEach(s => s.classList.toggle('on', s.dataset.c && s.dataset.c.toLowerCase() === c.toLowerCase()));
  const p = curPage();
  if (p && p.canvas.getActiveObjects().length) { activeObjs(p).forEach(o => o.set(o.type === 'path' || o.type === 'line' ? 'stroke' : 'fill', c)); p.canvas.requestRenderAll(); scheduleCommit(p); }
  if (App.tool === 'pen' && p) p.canvas.freeDrawingBrush && (p.canvas.freeDrawingBrush.color = c);
  setStroke(App.strokeWidth);
}
$('#hexInput').addEventListener('change', e => { const v = e.target.value.trim(); if (/^#?[0-9a-fA-F]{6}$/.test(v)) applyColor(v.startsWith('#') ? v : '#' + v); else e.target.value = App.color; });
$('#opSlider').oninput = e => { App.opacity = +e.target.value / 100; $('#opOut').textContent = e.target.value + '%'; const p = curPage(); if (p && p.canvas.getActiveObjects().length) { activeObjs(p).forEach(o => o.set('opacity', App.opacity)); p.canvas.requestRenderAll(); scheduleCommit(p); updatePropsBar(); } };

/* ================= SELETTORE COLORE AVANZATO (visualizzatori + tavolozze) ================= */
function hsv2rgb(h, s, v) { s /= 100; v /= 100; const k = n => (n + h / 60) % 6; const f = n => v - v * s * Math.max(0, Math.min(k(n), 4 - k(n), 1)); return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)]; }
function rgb2hsv(r, g, b) { r /= 255; g /= 255; b /= 255; const M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m; let h = 0; if (d) { if (M === r) h = ((g - b) / d) % 6; else if (M === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; } return [Math.round(h), Math.round(M ? d / M * 100 : 0), Math.round(M * 100)]; }
function rgb2cmyk(r, g, b) { r /= 255; g /= 255; b /= 255; const k = 1 - Math.max(r, g, b); if (k >= 1) return [0, 0, 0, 100]; return [Math.round((1 - r - k) / (1 - k) * 100), Math.round((1 - g - k) / (1 - k) * 100), Math.round((1 - b - k) / (1 - k) * 100), Math.round(k * 100)]; }
function cmyk2rgb(c, m, y, k) { [c, m, y, k] = [c, m, y, k].map(v => v / 100); return [Math.round(255 * (1 - c) * (1 - k)), Math.round(255 * (1 - m) * (1 - k)), Math.round(255 * (1 - y) * (1 - k))]; }
function rgb2lab(r, g, b) { const f = v => { v /= 255; return v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; const [R, G, B] = [f(r), f(g), f(b)]; let X = (R * .4124 + G * .3576 + B * .1805) / .95047, Y = R * .2126 + G * .7152 + B * .0722, Z = (R * .0193 + G * .1192 + B * .9505) / 1.08883; const g2 = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; X = g2(X); Y = g2(Y); Z = g2(Z); return [Math.round(116 * Y - 16), Math.round(500 * (X - Y)), Math.round(200 * (Y - Z))]; }
function lab2rgb(L, a, bb) { let Y = (L + 16) / 116, X = Y + a / 500, Z = Y - bb / 200; const f = t => { const t3 = t * t * t; return t3 > .008856 ? t3 : (t - 16 / 116) / 7.787; }; X = f(X) * .95047; Y = f(Y); Z = f(Z) * 1.08883; const R = X * 3.2406 + Y * -1.5372 + Z * -.4986, G = X * -.9689 + Y * 1.8758 + Z * .0415, B = X * .0557 + Y * -.2040 + Z * 1.0570; const g = v => { v = v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(v, 0), 1 / 2.4) - .055; return Math.round(clamp(v, 0, 1) * 255); }; return [g(R), g(G), g(B)]; }
const CNAMES = [['Rosso','#DC2626'],['Arancio','#F97316'],['Giallo','#FACC15'],['Verde','#22C55E'],['Ciano','#00A0E3'],['Azzurro','#0EA5E9'],['Blu','#2563EB'],['Viola','#7C3AED'],['Magenta','#EC4899'],['Rosa','#FFD1E3'],['Marrone','#78350F'],['Nero','#141414'],['Bianco','#FFFFFF'],['Grigio','#64748B'],['Beige','#E8E2DA'],['Panna','#FFF6C9']];
function hexRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function colorName(rgb) { let best = null, bd = 1e9; CNAMES.forEach(([n, h]) => { const c = hexRgb(h); const d = (c[0]-rgb[0])**2 + (c[1]-rgb[1])**2 + (c[2]-rgb[2])**2; if (d < bd) { bd = d; best = n; } }); return bd < 4200 ? best : 'Personalizzato'; }

let cp = { h: 0, s: 0, v: 0 }, cpMode = 'H', cpView = 'vis';
function openColorPicker() {
  [cp.h, cp.s, cp.v] = rgb2hsv(...hexRgb(App.color));
  openModal(`<div class="m-title"><span class="dot"></span>Riempimento uniforme</div>
    <div class="cp-top">
      <label class="cp-radio"><input type="radio" name="cpv" value="vis" checked> Visualizzatori colore</label>
      <label class="cp-radio"><input type="radio" name="cpv" value="tav"> Tavolozze colore</label>
      <select class="m-select" id="cpViewSel" style="width:250px;padding:7px 10px;font-size:12.5px">
        <option value="H">HSB - Basato sulla tonalità</option><option value="S">HSB - Basato sulla saturazione</option><option value="V">HSB - Basato sulla luminosità</option>
      </select>
      <select class="m-select" id="cpModel" style="width:120px;padding:7px 10px;font-size:12.5px"><option>CMYK</option><option>RGB</option><option>HSB</option><option>Lab</option></select>
    </div>
    <div class="m-body">
      <div id="cpVis" class="cp-wrap">
        <div class="cp-left"><canvas id="cpSV" width="280" height="200"></canvas><canvas id="cpHue" width="280" height="16"></canvas></div>
        <div class="cp-right">
          <div class="m-label">Nome</div><input class="m-input" id="cpName" style="margin-bottom:12px">
          <div class="cp-grid">
            <div class="cp-f"><b>R</b><input id="cpR" type="number" min="0" max="255"></div><div class="cp-f"><b>G</b><input id="cpG" type="number" min="0" max="255"></div><div class="cp-f"><b>B</b><input id="cpB" type="number" min="0" max="255"></div><div class="cp-f"><b>Hex</b><input id="cpHex"></div>
            <div class="cp-f"><b>C</b><input id="cpC" type="number" min="0" max="100"></div><div class="cp-f"><b>M</b><input id="cpM" type="number" min="0" max="100"></div><div class="cp-f"><b>Y</b><input id="cpY" type="number" min="0" max="100"></div><div class="cp-f"><b>K</b><input id="cpK" type="number" min="0" max="100"></div>
            <div class="cp-f"><b>H</b><input id="cpH" type="number" min="0" max="360"></div><div class="cp-f"><b>S</b><input id="cpS" type="number" min="0" max="100"></div><div class="cp-f"><b>V</b><input id="cpV" type="number" min="0" max="100"></div><div class="cp-f"><b>L</b><input id="cpL" type="number" min="0" max="100"></div>
            <div class="cp-f"><b>a</b><input id="cpA" type="number"></div><div class="cp-f"><b>b</b><input id="cpB2" type="number"></div>
          </div>
        </div>
      </div>
      <div id="cpTav" style="display:none">
        <div class="m-label">Moderni</div><div class="swatches" id="cpSwM" style="margin-bottom:14px"></div>
        <div class="m-label">Pastello</div><div class="swatches" id="cpSwP" style="margin-bottom:14px"></div>
        <div class="m-label">Colori del documento</div><div class="swatches" id="cpSwD"></div>
      </div>
      <div class="cp-foot"><div id="cpPrev"></div><input class="m-input" id="cpNameShow" style="flex:1" readonly>
        <button class="btn" id="cpEye" title="Contagocce di sistema"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-4 9.5-9.5 3 3L6 21l-4 1z"/><path d="m13 7 4-4 4 4-4 4"/></svg></button>
      </div>
    </div>
    <div class="m-actions"><button class="btn" data-close>Annulla</button><button class="btn accent" id="cpOk">Applica colore</button></div>`);
  const sv = $('#cpSV'), hue = $('#cpHue');
  const sq = (h, s, v) => hsv2rgb(h, s, v);
  function drawSV() {
    const x = sv.getContext('2d'), W = sv.width, H = sv.height;
    const img = x.createImageData(W, H);
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      let h, s, v;
      const u = px / W * 100, w2 = 100 - py / H * 100;
      if (cpMode === 'H') { h = cp.h; s = u; v = w2; }
      else if (cpMode === 'S') { h = u * 3.6; s = cp.s; v = w2; }
      else { h = u * 3.6; s = w2; v = cp.v; }
      const [r, g, b] = sq(h, s, v); const i = (py * W + px) * 4;
      img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
    }
    x.putImageData(img, 0, 0);
    let mx, my;
    if (cpMode === 'H') { mx = cp.s / 100 * W; my = (100 - cp.v) / 100 * H; }
    else if (cpMode === 'S') { mx = cp.h / 360 * W; my = (100 - cp.v) / 100 * H; }
    else { mx = cp.h / 360 * W; my = (100 - cp.s) / 100 * H; }

      let rgb;
      const u = px / W * 100;
      if (cpMode === 'H') rgb = sq(u * 3.6, 100, 100);
      else if (cpMode === 'S') rgb = sq(cp.h, u, cp.v);
      else rgb = sq(cp.h, cp.s, u);
      for (let py = 0; py < H; py++) { const i = (py * W + px) * 4; img.data[i] = rgb[0]; img.data[i+1] = rgb[1]; img.data[i+2] = rgb[2]; img.data[i+3] = 255; }
    }
    x.putImageData(img, 0, 0);

  function fromSV(e) {

    if (cpMode === 'H') { cp.s = u; cp.v = w2; } else if (cpMode === 'S') { cp.h = u * 3.6; cp.v = w2; } else { cp.h = u * 3.6; cp.s = w2; }

  }
  function fromHue(e) {
    const r = hue.getBoundingClientRect(), u = clamp((e.clientX - r.left) / r.width * 100, 0, 100);

  function drag(el, fn) { el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); fn(e); const mv = ev => fn(ev); const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); }; el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); }); }
  drag(sv, fromSV); drag(hue, fromHue);

  document.querySelectorAll('[name=cpv]').forEach(r => r.onchange = () => { cpView = r.value; $('#cpVis').style.display = cpView === 'vis' ? '' : 'none'; $('#cpTav').style.display = cpView === 'tav' ? '' : 'none'; });
  const fillTav = (id, list) => { $(id).innerHTML = list.map(c => `<span class="sw" style="background:${c}" data-c="${c}"></span>`).join('') || '<span class="none" style="font-size:12px;color:#a09a90">nessuno</span>'; };
  fillTav('#cpSwM', MODERN); fillTav('#cpSwP', PASTEL); fillTav('#cpSwD', docColorList());
  $('#cpTav').addEventListener('click', e => { const s = e.target.closest('[data-c]'); if (!s) return; [cp.h, cp.s, cp.v] = rgb2hsv(...hexRgb(s.dataset.c)); sync(); });
  const on = (id, fn) => $(id).addEventListener('input', e => { fn(+e.target.value); sync(); });
  on('#cpR', v => { [cp.h, cp.s, cp.v] = rgb2hsv(v, +$('#cpG').value, +$('#cpB').value); });
  on('#cpG', v => { [cp.h, cp.s, cp.v] = rgb2hsv(+$('#cpR').value, v, +$('#cpB').value); });
  on('#cpB', v => { [cp.h, cp.s, cp.v] = rgb2hsv(+$('#cpR').value, +$('#cpG').value, v); });
  on('#cpC', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...cmyk2rgb(v, +$('#cpM').value, +$('#cpY').value, +$('#cpK').value)); });
  on('#cpM', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...cmyk2rgb(+$('#cpC').value, v, +$('#cpY').value, +$('#cpK').value)); });
  on('#cpY', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...cmyk2rgb(+$('#cpC').value, +$('#cpM').value, v, +$('#cpK').value)); });
  on('#cpK', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...cmyk2rgb(+$('#cpC').value, +$('#cpM').value, +$('#cpY').value, v)); });
  on('#cpH', v => cp.h = clamp(v, 0, 360)); on('#cpS', v => cp.s = clamp(v, 0, 100)); on('#cpV', v => cp.v = clamp(v, 0, 100));
  on('#cpL', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...lab2rgb(v, +$('#cpA').value, +$('#cpB2').value)); });
  on('#cpA', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...lab2rgb(+$('#cpL').value, v, +$('#cpB2').value)); });
  on('#cpB2', v => { [cp.h, cp.s, cp.v] = rgb2hsv(...lab2rgb(+$('#cpL').value, +$('#cpA').value, v)); });

let modalDismiss = null;
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalBack').classList.add('show'); }
function closeModal() { $('#modalBack').classList.remove('show'); }
function dismissModal() { closeModal(); if (modalDismiss) { const f = modalDismiss; modalDismiss = null; f(); } }
$('#modalBack').addEventListener('mousedown', e => { if (e.target === $('#modalBack')) dismissModal(); });
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) dismissModal(); });
function askConfirm(o) { return new Promise(res => { openModal(`<div class="m-title"><span class="dot" ${o.danger ? 'style="background:#c81e1e"' : ''}></span>${esc(o.title)}</div><div class="m-sub">${esc(o.msg)}</div><div class="m-actions"><button class="btn" id="cfNo">Annulla</button><button class="btn ${o.danger ? 'danger' : 'accent'}" id="cfOk">${esc(o.ok || 'Conferma')}</button></div>`); const done = v => { modalDismiss = null; closeModal(); res(v); }; modalDismiss = () => done(false); $('#cfNo').onclick = () => done(false); $('#cfOk').onclick = () => done(true); }); }

$('#fileProject').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const data = JSON.parse(fr.result);
      if (data.app !== 'tela' || !data.pages) throw new Error('formato');
      if (data.kind === 'overlay') {
        for (let i = 0; i < data.pages.length; i++) {
          const op = data.pages[i];
          let p = App.pages[i];
          if (!p) p = createPage({ name: 'Pagina ' + (i + 1), w: op.w, h: op.h });
          const tgt = p.canvas;
          await new Promise(res => fabric.util.enlivenObjects(op.objects, objs => { objs.forEach(o => tgt.add(o)); tgt.requestRenderAll(); res(); }));
          scheduleCommit(p);

        refreshDocColors(); toast('Livello applicato alle pagine correnti');
        e.target.value = ''; return;

      if (App.pages.some(p => p.canvas.getObjects().length)) { const ok = await askConfirm({ title: 'Sostituire il lavoro attuale?', msg: 'Importando questo progetto le pagine attuali verranno sostituite.', ok: 'Importa' }); if (!ok) return; }
      App.pages.forEach(p => { p.canvas.dispose(); p.wrap.remove(); });
      App.pages = [];
      data.pages.forEach(pd => { const p = createPage({ name: pd.name, w: pd.w, h: pd.h, mode: pd.mode }); p.loading = true; p.canvas.loadFromJSON(JSON.stringify(pd.json), () => { p.loading = false; p.last = JSON.stringify(snap(p.canvas)); p.canvas.renderAll(); updateThumb(p); updateEmptyHint(p); }); });
      setActivePage(0); fitZoom(); refreshDocColors(); toast('Progetto importato ✓');
    } catch (err) { toast('File non valido: usa un salvataggio .tela di Tela'); }
  };
  fr.readAsText(f); e.target.value = '';
});

function cssHex(css) { if (!css || typeof css !== 'string') return null; if (css[0] === '#') return css.length === 7 ? css : null; const m = css.match(/rgba?\(([^)]+)\)/); if (m) { const p = m[1].split(',').map(Number); return rgbHex(p[0], p[1], p[2]); } return null; }

async function vectorPDF(pages, o) {

    if (!doc) doc = new jsPDF({ unit: 'pt', format: [p.w, p.h], orientation: p.w > p.h ? 'l' : 'p', compress: true });

async function pageData(p, fmt, alpha, quality, cmyk) {

/* ================= TASTIERA ================= */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { dismissModal(); ctxEl.style.display = 'none'; ['shapesPop','flagPop','hlPop','strokePop','colorGroupPop'].forEach(id => $('#' + id).style.display = 'none'); return; }
  if (isTyping()) return;
  const p = curPage(); if (!p) return;
  const editing = p.canvas.getActiveObject() && p.canvas.getActiveObject().isEditing;
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'c' && !editing) { e.preventDefault(); copySel(false); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'x' && !editing) { e.preventDefault(); copySel(true); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'v' && !editing) { e.preventDefault(); pasteSel(); return; }
  if (mod && e.key.toLowerCase() === 'a' && !editing) { e.preventDefault(); selectAllPage(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); $('#btnSave').click(); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (editing) return;
  if (['Delete','Backspace'].includes(e.key)) { e.preventDefault(); deleteSel(); return; }
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-step, 0); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nudge(step, 0); }
  if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -step); }
  if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, step); }
  if (e.key === 'PageDown') setActivePage(App.active + 1);
  if (e.key === 'PageUp') setActivePage(App.active - 1);
  const km = { v: 'select', t: 'text', p: 'pen', h: 'highlight', e: 'eraser', s: 'shapes', f: 'flag', b: 'fill', i: 'picker' };
  if (!mod && km[e.key.toLowerCase()] && !e.altKey) setTool(km[e.key.toLowerCase()]);
});
